[package]
name = "stair-viewport"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "webgpu", "webgl", "wgsl"] }
glam = "0.30"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Event"] }
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"

