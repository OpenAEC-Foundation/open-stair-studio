name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: Check release version
        shell: pwsh
        run: |
          node scripts/check-release-version.mjs '${{ github.ref_name }}'
      - name: Resolve locked Rust dependencies
        shell: pwsh
        run: cargo metadata --locked --format-version 1 | Out-Null
      - name: Install dependencies
        run: npm ci
      - name: Verify geometry, calculations and IFC
        run: npm run verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reopen BIM exports with IfcOpenShell and check manufactured joints
        run: |
          python -m pip install ifcopenshell==0.9.0.post1 pytest manifold3d
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify-bim-semantics.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify-ifc-independent.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/audit-riser-ifc.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify-ifcx-independent.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $comparison = Join-Path $env:RUNNER_TEMP 'wel-tweekwart'
          node scripts/export-wel-tweekwart.mjs $comparison
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/measure-wel-tweekwart.py --verify-exports $comparison
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/export-wel-tweekwart.mjs $comparison --bordessen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify-wel-landing.py $comparison
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compact = Join-Path $env:RUNNER_TEMP 'tweekwart-buitenmaten'
          node scripts/export-compact-tweekwart.mjs $compact --varianten
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/measure-compact-tweekwart.py $compact --express
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $newels = Join-Path $env:RUNNER_TEMP 'tweekwart-spillen'
          node scripts/export-newel-tweekwart.mjs $newels --varianten
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/measure-newel-tweekwart.py $newels --express
        shell: pwsh
      - name: Build signed Windows installer and updater artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run desktop:build
      - name: Verify and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          $installer = @(Get-ChildItem -LiteralPath 'target/release/bundle/nsis' -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw "Expected one NSIS installer; found $($installer.Count)" }
          $signature = "$($installer[0].FullName).sig"
          if (!(Test-Path -LiteralPath $signature)) { throw "Updater signature missing: $signature" }
          $safeName = $installer[0].Name.Replace(' ', '.')
          if ($safeName -ne $installer[0].Name) {
            $safeInstaller = Join-Path $installer[0].DirectoryName $safeName
            Move-Item -LiteralPath $installer[0].FullName -Destination $safeInstaller
            Move-Item -LiteralPath $signature -Destination "$safeInstaller.sig"
            $installer = @(Get-Item -LiteralPath $safeInstaller)
            $signature = "$safeInstaller.sig"
          }
          $env:OSS_RELEASE_TAG = $tag
          $env:OSS_INSTALLER_NAME = $installer[0].Name
          $env:OSS_SIGNATURE_PATH = $signature
          node scripts/make-update-manifest.mjs 'target/release/bundle/nsis/latest.json'
          if ($LASTEXITCODE -ne 0) { throw 'Update manifest validation failed' }
          gh release create $tag $installer[0].FullName $signature 'target/release/bundle/nsis/latest.json' --verify-tag --title "Open Stair Studio $tag" --notes-file '.github/release-notes.md' --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
